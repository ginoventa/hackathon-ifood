[project]
name = "ailo"
version = "2.0.0"
description = "Ailo: agente do iFood para pessoas com restrições alimentares (LangChain + Gemini + MCP do iFood)."
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.143.3",
    "uvicorn==0.54.0",
    "httpx==0.28.1",
    "langchain==1.4.6",
    "langchain-core==1.6.12",
    "langchain-google-genai==4.4.2",
    "langchain-mcp-adapters==0.3.2",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
