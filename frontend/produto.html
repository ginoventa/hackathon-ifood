<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1" name="viewport"/>
    <title>
      Detalhes do produto • iFood
    </title>
    <link href="./shop.css" rel="stylesheet"/>
    <script src="./product.js" type="module">
    </script>
  </head>
  <body class="product-page">
    <header class="product-header">
      <a aria-label="Voltar para a loja" class="back-link" href="./loja.html">
        <svg class="back-icon">
          <use href="./icons.svg#back">
          </use>
        </svg>
        <span>
          Voltar para a loja
        </span>
      </a>
      <a class="ifood-logo" href="./loja.html">
        <img alt="iFood" src="https://upload.wikimedia.org/wikipedia/commons/9/90/IFood_logo.svg"/>
      </a>
    </header>
    <main class="product-layout" id="product-detail">
      <div class="product-visual">
        <img alt="" id="product-image"/>
      </div>
      <form class="product-details" id="product-form">
        <a class="store-link" href="./loja.html">
          Burguer do Bairro
          <span>
            ›
          </span>
        </a>
        <span class="dietary-badge" hidden="" id="dietary-badge">
        </span>
        <h1 id="product-name">
        </h1>
        <p class="product-description" id="product-description">
        </p>
        <div class="detail-price">
          <strong id="product-price">
          </strong>
          <del hidden="" id="original-price">
          </del>
        </div>
        <fieldset class="options-group" id="extras-group">
          <legend>
            Deixe do seu jeito
            <span>
              Opcional
            </span>
          </legend>
          <label class="extra-option">
            <span>
              Mais cheddar
              <small>
                + R$ 4,00
              </small>
            </span>
            <input data-label="Mais cheddar" name="extras" type="checkbox" value="4"/>
          </label>
          <label class="extra-option">
            <span>
              Bacon crocante
              <small>
                + R$ 5,00
              </small>
            </span>
            <input data-label="Bacon crocante" name="extras" type="checkbox" value="5"/>
          </label>
          <label class="extra-option">
            <span>
              Hambúrguer extra
              <small>
                + R$ 9,00
              </small>
            </span>
            <input data-label="Hambúrguer extra" name="extras" type="checkbox" value="9"/>
          </label>
        </fieldset>
        <div class="notes-field">
          <label for="product-notes">
            Alguma observação?
          </label>
          <textarea id="product-notes" maxlength="200" placeholder="Ex.: tirar a cebola, maionese à parte..." rows="3"></textarea>
          <span id="notes-count">
            0/200
          </span>
        </div>
        <div class="purchase-actions">
          <div class="quantity-control">
            <button aria-label="Diminuir quantidade" disabled="" id="decrease" type="button">
              −
            </button>
            <output aria-live="polite" id="quantity">
              1
            </output>
            <button aria-label="Aumentar quantidade" id="increase" type="button">
              +
            </button>
          </div>
          <button class="add-button" type="submit">
            <span>
              Adicionar
            </span>
            <strong id="item-total">
            </strong>
          </button>
        </div>
        <p hidden="" id="product-feedback" role="status">
        </p>
      </form>
    </main>
    <section class="missing-product" hidden="" id="missing-product">
      <h1>
        Produto não encontrado
      </h1>
      <p>
        Explore o cardápio para escolher outra delícia.
      </p>
      <a class="back-link" href="./loja.html">
        Voltar para a loja →
      </a>
    </section>
  </body>
</html>
